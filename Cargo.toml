[package]
name = "tophat"
version = "0.1.0"
edition = "2021"
description = "An LLM skill/structure based on riprap applied to science workflows"
authors = ["Fabian Byléhn <bylehn@pm.me>"]
license = "BSD-3-Clause"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1"
sha2 = "0.11.1"
yaml-rust2 = "0.13.0"

[workspace]
members = ["xtask"]
