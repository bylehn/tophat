name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Reject committed credentials
        if: runner.os == 'Linux'
        run: .riprap/managed/hooks/check-secrets.sh --repository

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Run doctests
        run: cargo test --doc

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: unittests
          name: codecov-${{ matrix.os }}

  snakemake:
    # The Snakemake-backed tests (pipelines, QC gates, trial runs, external stages). With
    # TOPHAT_REQUIRE_SNAKEMAKE=1 they fail instead of skipping, so this job cannot pass without
    # running them (rqm/testing.md).
    name: Snakemake-backed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snakemake
        run: |
          python -m venv "$RUNNER_TEMP/snakemake"
          "$RUNNER_TEMP/snakemake/bin/pip" install 'snakemake>=8,<10'
          echo "TOPHAT_TEST_SNAKEMAKE=$RUNNER_TEMP/snakemake/bin/snakemake" >> "$GITHUB_ENV"

      - name: Run the tests
        env:
          TOPHAT_REQUIRE_SNAKEMAKE: "1"
        run: cargo test --no-fail-fast --test snakemake --test external --test workflow

  template:
    # Renders the project template with the real Copier (rqm/template/project.md). With
    # TOPHAT_REQUIRE_COPIER=1 the tests fail instead of skipping when Copier is missing.
    name: Template rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copier
        run: pip install 'copier>=9,<10'

      - name: Run the tests
        env:
          TOPHAT_REQUIRE_COPIER: "1"
        run: cargo test --test template --test launcher --test skills

  image:
    # Builds the real dev container image with Podman and runs the image scenarios of
    # rqm/template/container.md (TOPHAT_TEST_PODMAN=1).
    name: Dev container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copier
        run: pip install 'copier>=9,<10'

      - name: Build and test the image
        env:
          TOPHAT_REQUIRE_COPIER: "1"
          TOPHAT_TEST_PODMAN: "1"
        run: |
          podman --version
          cargo test --test launcher -- --test-threads=1

  e2e:
    # The worked example study from question to report with the project's own pixi environment,
    # then a tool pin change and failing returns of an external job (rqm/testing.md).
    name: End-to-end example study
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copier and pixi
        run: |
          pip install 'copier>=9,<10'
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Run the end-to-end test
        env:
          TOPHAT_TEST_E2E: "1"
        run: |
          pixi --version
          cargo test --test e2e -- --nocapture

  traceability:
    # Every Gherkin scenario in rqm/ is referenced by a test, except those of files listed in
    # xtask/pending.txt (rqm/tooling.md).
    name: Scenario traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check scenario references
        run: cargo xtask scenarios
