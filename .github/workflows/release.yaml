# Publish a TopHat release: build both musl binaries, run the gates against them, write the
# release pin, re-run the render and end-to-end tests with that pin, upload a draft release, and
# verify the published assets before making it public (rqm/testing.md §CI Workflows, rq-e6ed00d3).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build the release binary
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Stage the binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tophat" "dist/tophat-${{ matrix.target }}"
          chmod +x "dist/tophat-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tophat-${{ matrix.target }}
          path: dist/tophat-${{ matrix.target }}
          if-no-files-found: error

  gates:
    name: Release gates
    needs: build
    # Julia's conda-forge libopenlibm still requests an executable stack, which glibc >= 2.41
    # refuses to load. Pin the runner until conda-forge ships openlibm >= 0.8.4.
    runs-on: ubuntu-24.04
    env:
      TOPHAT_TEST_BINARY: ${{ github.workspace }}/dist/tophat-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: tophat-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Install Copier, pixi, Podman and qemu
        run: |
          version=$(sed -n 's/^copier_version: *//p' template/.tophat/managed/container/versions.yaml)
          python -m pip install "copier==${version}"
          pixi_version=$(sed -n 's/^pixi_version: *//p' template/.tophat/managed/container/versions.yaml)
          pixi_sha=$(sed -n 's/^pixi_sha256_x86_64: *//p' template/.tophat/managed/container/versions.yaml)
          curl -fsSL -o "$RUNNER_TEMP/pixi.tar.gz" \
            "https://github.com/prefix-dev/pixi/releases/download/v${pixi_version}/pixi-x86_64-unknown-linux-musl.tar.gz"
          echo "${pixi_sha}  $RUNNER_TEMP/pixi.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pixi.tar.gz" -C "$RUNNER_TEMP" pixi
          sudo install -m 0755 "$RUNNER_TEMP/pixi" /usr/local/bin/pixi
          sudo apt-get update
          sudo apt-get install -y podman qemu-user-static
      - name: Make the binaries executable
        run: chmod +x dist/tophat-*
      - name: Check the aarch64 binary runs
        run: |
          version=$(qemu-aarch64-static dist/tophat-aarch64-unknown-linux-musl --version | awk '{print $NF}')
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::the aarch64 binary reports $version, not $expected"
            exit 1
          fi
      - name: Run the conformance suite against the x86_64 binary
        run: cargo xtask conformance --tophat "$TOPHAT_TEST_BINARY"
      - name: Write the release pin
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo xtask release-pin \
            --version "$version" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --binary "x86_64-unknown-linux-musl=dist/tophat-x86_64-unknown-linux-musl" \
            --binary "aarch64-unknown-linux-musl=dist/tophat-aarch64-unknown-linux-musl"
      - uses: actions/upload-artifact@v4
        with:
          name: tophat-release-pin
          path: template/.tophat/managed/tophat-release.yaml
          if-no-files-found: error
      - name: Render every answer set with the release pin
        run: |
          cargo build --bin tophat
          cargo xtask render-test
      - name: Run the worked example with the release binary
        env:
          TOPHAT_TEST_E2E: "1"
        run: cargo test -p tophat --test e2e

  publish:
    name: Publish the release
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tophat-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Write the SHA-256 checksums
        run: |
          cd dist
          sha256sum tophat-x86_64-unknown-linux-musl tophat-aarch64-unknown-linux-musl > SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/tophat-x86_64-unknown-linux-musl \
            dist/tophat-aarch64-unknown-linux-musl \
            dist/SHA256SUMS \
            --verify-tag \
            --draft \
            --title "TopHat ${GITHUB_REF_NAME#v}" \
            --notes "TopHat ${GITHUB_REF_NAME#v}. Downloaded binaries are checked against SHA256SUMS."

  verify:
    name: Verify the published release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tophat-release-pin
          path: pin
      - name: Install Copier and Podman
        run: |
          version=$(sed -n 's/^copier_version: *//p' template/.tophat/managed/container/versions.yaml)
          python -m pip install "copier==${version}"
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir published --pattern 'tophat-*' --pattern 'SHA256SUMS'
          cd published
          sha256sum -c SHA256SUMS
      - name: Render a project with the release pin
        run: |
          cp pin/tophat-release.yaml template/.tophat/managed/tophat-release.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template/.tophat/managed/tophat-release.yaml
          git commit -m "Pin the ${GITHUB_REF_NAME#v} release"
          copier copy --defaults --quiet --vcs-ref HEAD \
            --data project_name=verify \
            --data project_slug=verify \
            --data project_description="Release verification project" \
            --data author_name=TopHat \
            --data author_email=tophat@example.org \
            . "$RUNNER_TEMP/verify-project"
      - name: Install the pinned tophat from the release
        working-directory: ${{ runner.temp }}/verify-project
        run: |
          pin=.tophat/managed/tophat-release.yaml
          diff -u "${{ github.workspace }}/pin/tophat-release.yaml" "$pin"
          target=x86_64-unknown-linux-musl
          url=$(sed -n 's/^url: *//p' "$pin")
          expected=$(sed -n "s/^  $target: *//p" "$pin")
          # The release is still a draft, so its assets are not served from the public
          # releases/download URL. Use the authenticated copy fetched above, and check that the
          # pin names the public URL those assets will have once the draft is published.
          test "$url" = "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cp "${{ github.workspace }}/published/tophat-$target" "$RUNNER_TEMP/tophat"
          echo "$expected  $RUNNER_TEMP/tophat" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tophat"
          "$RUNNER_TEMP/tophat" --version
      - name: Make the draft release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Check the public download URL
        working-directory: ${{ runner.temp }}/verify-project
        run: |
          pin=.tophat/managed/tophat-release.yaml
          target=x86_64-unknown-linux-musl
          url=$(sed -n 's/^url: *//p' "$pin")
          expected=$(sed -n "s/^  $target: *//p" "$pin")
          curl -fsSL -o "$RUNNER_TEMP/tophat-public" "$url/tophat-$target"
          echo "$expected  $RUNNER_TEMP/tophat-public" | sha256sum -c -
