# Questions and settings of the TopHat project template (rqm/template/project.md).

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_exclude:
  # Pre-solved locks, one per language selection; pixi.lock includes the matching one.
  - .locks
_skip_if_exists:
  # Project-owned files: written once by `copier copy`, never by `copier update`.
  - PROJECT.md
  - README.md
  - pixi.toml
  - pixi.lock
  - .gitignore
  - exploration/README.md
  - .tophat/roots.yaml

project_name:
  type: str
  help: Project name
  validator: "{% if not project_name.strip() %}The project name must not be empty{% endif %}"

project_slug:
  type: str
  help: Short identifier (lowercase letters, digits and single hyphens)
  default: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}The slug must use
    lowercase letters, digits and single hyphens, and start with a letter{% endif %}

project_description:
  type: str
  help: One-paragraph description of the project
  validator: >-
    {% if not project_description.strip() %}The description must not be empty{% elif '\n\n' in
    project_description %}The description must be one paragraph{% endif %}

author_name:
  type: str
  help: Author name
  validator: "{% if not author_name.strip() %}The author name must not be empty{% endif %}"

author_email:
  type: str
  help: Author email
  validator: "{% if '@' not in author_email %}The author email must contain @{% endif %}"

languages:
  type: str
  help: Languages to install besides Python (which Snakemake needs)
  multiselect: true
  choices:
    - julia
  default: []

agents:
  type: str
  help: Coding agents to set up
  multiselect: true
  choices:
    - claude-code
  default: [claude-code]
  validator: "{% if not agents %}Select at least one agent{% endif %}"

gpu:
  type: str
  help: Default GPU setting of the dev container
  choices:
    - auto
    - "on"
    - "off"
  default: auto
